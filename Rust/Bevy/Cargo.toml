[package]
name = "languageperformance"
version = "1.0.0"
edition = "2021"

[dependencies]
bevy = "0.15"
bevy_window_utils = "0.15"
csv = "1.3"
rayon = "1.10"

[build-dependencies]
embed-resource = "2.4"

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"