[package]
name = "languageperformance"
version = "1.0.0"
edition = "2021"

[dependencies]
macroquad = "0.4"
rayon = "1.10"
image = { version = "0.24", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[profile.dev.package.'*']
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3